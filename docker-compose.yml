services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"   # Reflex frontend (Next.js)
      - "8000:8000"   # Reflex backend (FastAPI + WebSocket)
    environment:
      # Required: your Google Gemini API key
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # The URL the browser uses to reach the backend.
      # For local QNAP access: http://<nas-ip>:8000
      # For external access via hostname: https://<your-hostname>:8000
      # Changing this requires rebuilding the image (docker compose up --build)
      # because it gets baked into the React frontend bundle.
      - API_URL=${API_URL:-http://localhost:8000}
    volumes:
      # SQLite database — persisted to host disk so data survives container rebuilds
      - ./data/reflex.db:/app/reflex.db
      # Next.js build cache — avoids re-building the frontend on every restart
      - reflex_web:/app/.web
      # Reflex runtime cache (bun, node modules, etc.)
      - reflex_cache:/root/.local/share/reflex

volumes:
  reflex_web:
  reflex_cache:
